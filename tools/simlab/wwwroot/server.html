<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unruled Traffic Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --slate: #1C2630;
    --bay: #24313C;
    --bay-line: #34444F;
    --paper: #DCE3E8;
    --paper-dim: #C3CDD4;
    --ink: #17212A;
    --ink-soft: #4A5864;
    --text: #E4EAEE;
    --text-dim: #93A3AE;
    --amber: #E0A32E;
    --fault: #C8432F;
    --ok: #5FA37A;
    --industrialist: #2E8C86;
    --sentinel: #4F6FA8;
    --raider: #8A4D7A;
    --warlord: #B5562F;
    --technocrat: #8C7A2E;
    --human: #6B7A86;
    --display: "Chakra Petch", "Segoe UI", sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--slate); color: var(--text); font: 15px/1.45 var(--body); }
  body { font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: var(--bay); border: 1px solid var(--bay-line); border-radius: 3px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--text-dim); }
  button:focus-visible, select:focus-visible, input:focus-visible, .strip:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 2px;
  }
  button.primary { background: var(--amber); color: var(--ink); border-color: var(--amber); font-weight: 600; }
  select, input { background: var(--slate); border: 1px solid var(--bay-line); border-radius: 3px; padding: 5px 8px; }

  /* The server bar: the clock is the one loud thing up here. */
  .bar {
    display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
    padding: 18px 28px; border-bottom: 1px solid var(--bay-line);
  }
  .clock { font: 700 44px/1 var(--display); color: var(--amber); letter-spacing: 0.01em; white-space: nowrap; }
  .clock small { font: 500 16px var(--display); color: var(--text-dim); margin-left: 10px; }
  .clock.paused { color: var(--text-dim); }
  .vitals { display: flex; flex-wrap: wrap; gap: 6px 26px; }
  .vital { min-width: 90px; }
  .vital b { display: block; font: 600 20px/1.2 var(--display); color: var(--text); }
  .vital span { color: var(--text-dim); font-size: 13px; }
  .vital.warn b { color: var(--amber); }
  .vital.bad b { color: var(--fault); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }

  /* Rules: how the bot manager behaves. */
  .rules {
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 28px;
    border-bottom: 1px solid var(--bay-line); color: var(--text-dim); font-size: 14px;
  }
  .rules label { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rules input[type=number] { width: 70px; }
  .rules .note { margin-left: auto; }

  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 22px 28px 40px; }
  .bay { background: var(--bay); border: 1px solid var(--bay-line); border-radius: 4px; min-width: 0; }
  .bay header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; padding: 14px 16px 10px; }
  .bay h2 { margin: 0; font: 600 19px var(--display); }
  .bay header .count { color: var(--text-dim); }
  .bay header .add { margin-left: auto; display: flex; gap: 6px; }
  .rack { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 14px; max-height: 70vh; overflow-y: auto; }
  .empty { color: var(--text-dim); padding: 6px 4px 10px; }

  /* The flight strip: printed paper, preset colour on the left edge, a notch cut for each fault. */
  .strip {
    position: relative; display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
    grid-template-areas: "call who money" "call where counts" "tags tags tags" "drawer drawer drawer";
    background: var(--paper); color: var(--ink); border-radius: 2px; padding: 9px 14px 9px 18px; cursor: pointer;
    border-left: 8px solid var(--edge, var(--human));
    clip-path: var(--notch, none);
  }
  .strip:hover { background: #E8EDF0; }
  .strip.open { background: #F1F4F6; }
  .callsign { grid-area: call; font: 700 24px/1 var(--display); }
  .who { grid-area: who; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where { grid-area: where; color: var(--ink-soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .money { grid-area: money; text-align: right; font-weight: 600; white-space: nowrap; }
  .money.debt { color: var(--fault); }
  .counts { grid-area: counts; text-align: right; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
  .pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 4px; }
  .pips i { display: inline-block; width: 16px; height: 16px; border: 1px solid var(--ink-soft); font: 600 10px/14px var(--display); text-align: center; font-style: normal; }
  .pips i.up { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tags { grid-area: tags; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 0 6px; border-radius: 2px; background: var(--paper-dim); color: var(--ink); }
  .tag.fault { background: var(--fault); color: #fff; }
  .tag.shield { background: var(--sentinel); color: #fff; }
  .tag.new { background: var(--ok); color: #fff; }

  .drawer { grid-area: drawer; border-top: 1px dashed var(--ink-soft); margin-top: 8px; padding-top: 10px; cursor: default; }
  .drawer .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .drawer button, .drawer select { background: var(--paper); color: var(--ink); border-color: var(--ink-soft); }
  .drawer button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .drawer ol { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-soft); }
  .drawer .stock { font-size: 13px; color: var(--ink-soft); }

  .log { padding: 0 28px 40px; }
  .log h2 { font: 600 19px var(--display); margin: 0 0 8px; }
  .log ol { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--bay-line); }
  .log li { display: grid; grid-template-columns: 92px 52px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--bay-line); font-size: 14px; }
  .log li span:first-child, .log li span:nth-child(2) { color: var(--text-dim); }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--paper); color: var(--ink); padding: 10px 14px; border-left: 6px solid var(--fault); display: none; max-width: 360px; }
  .toast.show { display: block; }
  .offline { padding: 40px 28px; color: var(--amber); font: 600 20px var(--display); display: none; }

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .bar { grid-template-columns: 1fr; }
    .controls { justify-content: flex-start; }
  }
  @media (max-width: 560px) {
    .bar, .rules, main, .log { padding-left: 16px; padding-right: 16px; }
    .clock { font-size: 34px; }
    .strip {
      grid-template-columns: 56px minmax(0, 1fr); padding-right: 10px;
      grid-template-areas: "call who" "call money" "where where" "counts counts" "tags tags" "drawer drawer";
    }
    .money, .counts { text-align: left; white-space: normal; }
    .bay header .add { margin-left: 0; width: 100%; }
    .bay header .add select { flex: 1; min-width: 0; }
    .rules .note { margin-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .strip { transition: background-color 120ms; }
  }
</style>
</head>
<body>
<section class="bar">
  <div class="clock" id="clock">Day –<small id="state">connecting</small></div>
  <div class="vitals">
    <div class="vital"><b id="online">–</b><span>players online</span></div>
    <div class="vital"><b id="bots">–</b><span>bots on duty</span></div>
    <div class="vital"><b id="empires">–</b><span>empires in the world</span></div>
    <div class="vital" id="costBox"><b id="cost">–</b><span>tick cost (budget used)</span></div>
    <div class="vital" id="saveBox"><b id="save">–</b><span>since last save</span></div>
  </div>
  <div class="controls">
    <select id="speed" aria-label="Speed">
      <option value="1">Real time</option>
      <option value="60">1 game min / s</option>
      <option value="600">10 game min / s</option>
      <option value="3600">1 game hour / s</option>
    </select>
    <button id="pause">Pause</button>
    <button id="saveNow">Save now</button>
  </div>
</section>

<section class="rules" aria-label="Bot rules">
  <label><input type="checkbox" id="auto"> Keep bots at half the players online</label>
  <label>at least <input type="number" id="min" min="0" max="100"></label>
  <label>at most <input type="number" id="max" min="0" max="100"></label>
  <label>random bot every <input type="number" id="spawn" min="0" max="168"> game hours (0 = off)</label>
  <button id="applyRules">Apply rules</button>
  <span class="note" id="world"></span>
</section>

<div class="offline" id="offline">The server isn't answering. Start it with: dotnet run -c Release -- server</div>

<main>
  <section class="bay" aria-labelledby="h-bots">
    <header>
      <h2 id="h-bots">Bots on duty</h2><span class="count" id="c-bots"></span>
      <div class="add">
        <select id="addPreset" aria-label="Preset for the new bot"></select>
        <button class="primary" id="addBot">Add bot</button>
      </div>
    </header>
    <div class="rack" id="r-bots"></div>
  </section>
  <section class="bay" aria-labelledby="h-held">
    <header><h2 id="h-held">Bots held</h2><span class="count" id="c-held"></span></header>
    <div class="rack" id="r-held"></div>
  </section>
  <section class="bay" aria-labelledby="h-players">
    <header>
      <h2 id="h-players">Players</h2><span class="count" id="c-players"></span>
      <div class="add"><button id="joinPlayer">Join a test player</button></div>
    </header>
    <div class="rack" id="r-players"></div>
  </section>
</main>

<section class="log">
  <h2>Server log</h2>
  <ol id="log"></ol>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
const EDGES = {
  Industrialist_Trader: "var(--industrialist)", Sentinel_Defender: "var(--sentinel)", Raider_Ambush: "var(--raider)",
  Warlord_Conqueror: "var(--warlord)", Technocrat_Explorer: "var(--technocrat)"
};
const NICE = {
  Industrialist_Trader: "Industrialist", Sentinel_Defender: "Sentinel", Raider_Ambush: "Raider",
  Warlord_Conqueror: "Warlord", Technocrat_Explorer: "Technocrat"
};
const KIND = { online: "Online", offline: "Offline", governed: "Offline, governor on" };
const $ = id => document.getElementById(id);
let status = null, players = [], open = null, rulesDirty = false;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body)
  });
  return res.json();
}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 4000);
}

async function act(path, body) {
  const r = await api(path, body);
  if (r && r.ok === false) toast(r.error);
  await refresh();
}

function fmt(n) { return Number(n).toLocaleString("en-US"); }
function hours(ticks) { const h = Math.floor(ticks / 3600), m = Math.floor(ticks % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; }
function ago(s) { return s < 0 ? "never" : s < 60 ? `${s} s` : `${Math.floor(s / 60)} min`; }

function renderStatus(s) {
  $("clock").firstChild.textContent = `Day ${s.day} · ${s.clock}`;
  $("clock").classList.toggle("paused", !s.running);
  $("state").textContent = s.running ? (s.speed === 1 ? "live" : `×${fmt(s.speed)}`) : "paused";
  $("pause").textContent = s.running ? "Pause" : "Resume";
  $("online").textContent = fmt(s.online);
  $("bots").textContent = `${s.bots} / ${s.rules.max}`;
  $("empires").textContent = fmt(s.empires);
  $("cost").textContent = `${s.tickCostMs.toFixed(2)} ms (${s.budgetPercent}%)`;
  $("costBox").className = "vital" + (s.budgetPercent > 80 ? " bad" : s.budgetPercent > 50 ? " warn" : "");
  $("save").textContent = s.lastSaveError ? "failed" : ago(s.autosaveAgeSeconds);
  $("saveBox").className = "vital" + (s.lastSaveError ? " bad" : s.autosaveAgeSeconds > s.autosaveMinutes * 120 ? " warn" : "");
  $("world").textContent = `${s.hubs} hubs · ${fmt(s.systems)} systems · ${s.memoryMb} MB · seed ${s.seed}`;
  if (document.activeElement !== $("speed")) $("speed").value = String(s.speed);
  if (!rulesDirty) {
    $("auto").checked = s.rules.autoScale;
    $("min").value = s.rules.min;
    $("max").value = s.rules.max;
    $("spawn").value = s.rules.randomSpawnHours;
  }
  const sel = $("addPreset");
  if (!sel.options.length)
    for (const p of s.presets) sel.add(new Option(NICE[p.code] || p.code, p.id));
}

function strip(p) {
  const el = document.createElement("article");
  el.className = "strip" + (open === p.id ? " open" : "");
  el.tabIndex = 0;
  el.style.setProperty("--edge", p.preset ? EDGES[p.preset] : "var(--human)");
  // each fault cuts a notch from the top right corner of the strip
  const n = p.flags.length;
  if (n) {
    const pts = ["0 0"];
    for (let i = 0; i < n; i++) pts.push(`calc(100% - ${24 + i * 22}px) 0`, `calc(100% - ${16 + i * 22}px) 7px`, `calc(100% - ${8 + i * 22}px) 0`);
    pts.push("100% 0", "100% 100%", "0 100%");
    el.style.setProperty("--notch", `polygon(${pts.join(",")})`);
  }
  const who = p.preset ? NICE[p.preset] || p.preset : (KIND[p.kind] || p.kind);
  const pips = ["M", "I", "L", "S"].map((l, i) => `<i class="${p.tech[i] > 1 ? "up" : ""}" title="${["Military", "Industry", "Logistics", "Signals"][i]} tier ${p.tech[i]}">${p.tech[i]}</i>`).join("");
  const tags = [];
  for (const f of p.flags) tags.push(`<span class="tag fault">${f}</span>`);
  if (p.shield) tags.push(`<span class="tag shield">shield, ${hours(p.shieldEndsIn)} left</span>`);
  if (p.newcomer) tags.push(`<span class="tag new">newcomer protection</span>`);
  if (p.kind === "governed" && p.preset) tags.push(`<span class="tag">governor</span>`);
  el.innerHTML = `
    <div class="callsign">P${p.id}</div>
    <div class="who">${who}</div>
    <div class="money ${p.debt > p.cash ? "debt" : ""}">${fmt(p.cash)} cr${p.debt ? ` · owes ${fmt(p.debt)}` : ""}</div>
    <div class="where"><span class="pips">${pips}</span></div>
    <div class="counts">${p.ships} ships · ${p.fleets} fleets · ${p.sites} sites</div>
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}`;
  el.addEventListener("click", e => {
    if (e.target.closest(".drawer")) return;
    open = open === p.id ? null : p.id;
    render();
  });
  el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target === el) el.click(); });
  if (open === p.id) el.appendChild(drawer(p));
  return el;
}

function drawer(p) {
  const d = document.createElement("div");
  d.className = "drawer";
  const isBot = p.kind === "bot" || p.kind === "held";
  if (isBot) {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Preset");
    for (const pr of status.presets) sel.add(new Option(NICE[pr.code] || pr.code, pr.id, false, pr.code === p.preset));
    const row = document.createElement("div");
    row.className = "row";
    const set = button("Change preset", () => act("/api/bots/set", { playerId: p.id, preset: Number(sel.value) }));
    const hold = p.kind === "held"
      ? button("Put back on duty", () => act("/api/bots/set", { playerId: p.id, hold: false }), true)
      : button("Hold (governor keeps its empire)", () => act("/api/bots/set", { playerId: p.id, hold: true }));
    row.append(sel, set, hold);
    d.append(row);
  } else {
    const row = document.createElement("div");
    row.className = "row";
    if (p.kind === "online") {
      row.append(button("Log out", () => act("/api/server/logout", { playerId: p.id, governor: false })),
        button("Log out with governor", () => act("/api/server/logout", { playerId: p.id, governor: true })));
    } else {
      row.append(button("Log in", () => act("/api/server/login", { playerId: p.id }), true));
    }
    if (p.newcomer) row.append(button("End newcomer protection", () => act("/api/server/tutorial-done", { playerId: p.id })));
    d.append(row);
  }
  const stock = document.createElement("div");
  stock.className = "stock";
  stock.textContent = `Home system ${p.home}. Core stock: fuel ${fmt(p.fuel)}, oxygen ${fmt(p.oxygen)}, rations ${fmt(p.rations)}. Shield used this week: ${p.weekShieldHours} h of 48.`;
  d.append(stock);
  if (p.recent && p.recent.length) {
    const ol = document.createElement("ol");
    for (const r of p.recent) { const li = document.createElement("li"); li.textContent = r; ol.append(li); }
    d.append(ol);
  }
  return d;
}

function button(label, onClick, primary) {
  const b = document.createElement("button");
  b.textContent = label;
  if (primary) b.className = "primary";
  b.addEventListener("click", e => { e.stopPropagation(); onClick(); });
  return b;
}

function fill(rackId, countId, list, emptyText) {
  const rack = $(rackId);
  const scroll = rack.scrollTop;
  rack.replaceChildren(...(list.length ? list.map(strip) : [Object.assign(document.createElement("p"), { className: "empty", textContent: emptyText })]));
  rack.scrollTop = scroll;
  $(countId).textContent = list.length;
}

function render() {
  if (!status) return;
  const byFault = (a, b) => b.flags.length - a.flags.length || a.id - b.id;
  fill("r-bots", "c-bots", players.filter(p => p.kind === "bot").sort(byFault), "No bots on duty. Add one, or raise the minimum.");
  fill("r-held", "c-held", players.filter(p => p.kind === "held").sort(byFault), "No bots held. Bots retired when players leave wait here.");
  fill("r-players", "c-players", players.filter(p => p.kind !== "bot" && p.kind !== "held")
    .sort((a, b) => (a.kind === "online" ? 0 : 1) - (b.kind === "online" ? 0 : 1) || a.id - b.id),
    "No players yet. Join a test player to try the login flow.");
}

async function refresh() {
  try {
    [status, players] = await Promise.all([api("/api/server/status"), api("/api/server/players")]);
    $("offline").style.display = "none";
    renderStatus(status);
    render();
    const log = await api("/api/server/log?since=0");
    $("log").replaceChildren(...log.slice(0, 80).map(l => {
      const li = document.createElement("li");
      const day = Math.floor(l.tick / 86400) + 1, h = Math.floor(l.tick % 86400 / 3600), m = Math.floor(l.tick % 3600 / 60);
      li.innerHTML = `<span>Day ${day} ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}</span><span>${l.playerId ? "P" + l.playerId : ""}</span><span></span>`;
      li.lastChild.textContent = l.text;
      return li;
    }));
  } catch {
    $("offline").style.display = "block";
    $("state").textContent = "not answering";
  }
}

$("pause").addEventListener("click", () => act("/api/server/run", { running: !status.running }));
$("speed").addEventListener("change", e => act("/api/server/run", { speed: Number(e.target.value) }));
$("saveNow").addEventListener("click", async () => {
  const r = await api("/api/server/save", {});
  toast(r.ok ? "Saved." : "Save failed: " + r.error);
  refresh();
});
$("addBot").addEventListener("click", () => act("/api/bots/add", { preset: Number($("addPreset").value) }));
$("joinPlayer").addEventListener("click", () => act("/api/server/login", { playerId: 0, join: true }));
for (const id of ["auto", "min", "max", "spawn"]) $(id).addEventListener("input", () => { rulesDirty = true; });
$("applyRules").addEventListener("click", async () => {
  rulesDirty = false;
  await act("/api/bots/rules", {
    autoScale: $("auto").checked, min: Number($("min").value), max: Number($("max").value),
    randomSpawnHours: Number($("spawn").value)
  });
  toast("Bot rules applied.");
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
